* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f1923;
  color: #e0e0e0;
  font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  padding: 24px;
}
.container { max-width: 960px; margin: 0 auto; }
.header { margin-bottom: 24px; }
.header h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
.header .sub { font-size: 13px; color: #8899aa; }
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: #1a2736;
  border-radius: 10px;
  padding: 14px 16px;
  border: 1px solid #1e3040;
}
.stat-card .label { font-size: 11px; color: #6b7f94; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.stat-card .value.up { color: #22ab94; }
.stat-card .value.down { color: #e0524a; }
.stat-card .subtext { font-size: 11px; color: #5a7a8a; margin-top: 2px; }
.chart-box {
  background: #1a2736;
  border-radius: 10px;
  padding: 20px;
  border: 1px solid #1e3040;
  margin-bottom: 20px;
}
.chart-box h3 {
  font-size: 14px;
  font-weight: 500;
  color: #8aaabc;
  margin-bottom: 12px;
}
canvas { width: 100% !important; }
.data-table {
  background: #1a2736;
  border-radius: 10px;
  padding: 16px;
  border: 1px solid #1e3040;
  max-height: 320px;
  overflow-y: auto;
}
.data-table h3 { font-size: 14px; font-weight: 500; color: #8aaabc; margin-bottom: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th {
  text-align: right; padding: 6px 8px; color: #5a7a8a;
  border-bottom: 1px solid #1e3040; position: sticky; top: 0;
  background: #1a2736; font-weight: 500;
}
th:first-child { text-align: left; }
td { text-align: right; padding: 5px 8px; border-bottom: 1px solid #15232e; }
td:first-child { text-align: left; color: #8aaabc; }
td.up { color: #22ab94; } td.down { color: #e0524a; }
.table-wrapper { max-height: 260px; overflow-y: auto; }
.table-wrapper::-webkit-scrollbar { width: 4px; }
.table-wrapper::-webkit-scrollbar-thumb { background: #2a4050; border-radius: 2px; }
.legend-box {
  display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 12px;
  font-size: 12px; color: #8aaabc;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
</style>
</head>

      <div class="legend-item"><span class="legend-dot" style="background:#4fc3f7"></span> 上证 MA150（150日均线）</div>
      <div class="legend-item"><span class="legend-dot" style="height:10px;width:10px;border-radius:50%;background:#e0524a"></span> A/D < 0 · A/D > 0</div>
