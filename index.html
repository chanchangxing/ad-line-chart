<html lang="zh-CN">

<meta charset="UTF-8">

<title>A/D Line × 上证指数 × 沪铝期货</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f1923;
  color: #e0e0e0;
  font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
  padding: 24px;
}
.container { max-width: 960px; margin: 0 auto; }
.header { margin-bottom: 24px; }
.header h1 { font-size: 22px; font-weight: 600; color: #fff; margin-bottom: 4px; }
.header .sub { font-size: 13px; color: #8899aa; }
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: #1a2736;
  border-radius: 10px;
  padding: 14px 16px;
  border: 1px solid #1e3040;
}
.stat-card .label { font-size: 11px; color: #6b7f94; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.stat-card .value.up { color: #22ab94; }
.stat-card .value.down { color: #e0524a; }
.stat-card .subtext { font-size: 11px; color: #5a7a8a; margin-top: 2px; }
.chart-box {
  background: #1a2736;
  border-radius: 10px;
  padding: 20px;
  border: 1px solid #1e3040;
  margin-bottom: 20px;
}
.chart-box h3 {
  font-size: 14px;
  font-weight: 500;
  color: #8aaabc;
  margin-bottom: 12px;
}
canvas { width: 100% !important; }
.legend-box {
  display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 12px;
  font-size: 12px; color: #8aaabc;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

/* ===== 个股监控 ===== */
.stock-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
.stock-card {
  background: #162231;
  border-radius: 10px;
  padding: 16px;
  border: 1px solid #1e3040;
}
.stock-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.stock-header .name { font-size: 15px; font-weight: 600; color: #fff; }
.stock-header .code { font-size: 11px; color: #5a7a8a; }
.stock-price { font-size: 26px; font-weight: 700; margin-bottom: 2px; }
.stock-price.up { color: #22ab94; } .stock-price.down { color: #e0524a; }
.stock-change { font-size: 12px; margin-bottom: 10px; }
.stock-change.up { color: #22ab94; } .stock-change.down { color: #e0524a; }
.stock-row { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; font-size: 11px; margin-bottom: 8px; }
.stock-row .label { color: #5a7a8a; } .stock-row .val { color: #c0d0e0; text-align: right; }
.stock-signal-box {
  margin-top: 10px; padding: 8px 12px;
  border-radius: 6px; font-size: 12px; font-weight: 500;
  display: flex; justify-content: space-between;
}
.stock-signal-box.buy { background: rgba(34,171,148,0.12); color: #22ab94; border: 1px solid rgba(34,171,148,0.25); }
.stock-signal-box.sell { background: rgba(224,82,74,0.12); color: #e0524a; border: 1px solid rgba(224,82,74,0.25); }
.stock-signal-box.neutral { background: rgba(106,127,148,0.1); color: #8aaabc; border: 1px solid rgba(106,127,148,0.15); }
.stock-ma-row { display: flex; gap: 8px; font-size: 10px; color: #5a7a8a; margin-top: 6px; }
.stock-ma-row span { padding: 2px 6px; border-radius: 3px; background: rgba(106,127,148,0.1); }
@media (max-width: 768px) { .stock-cards { grid-template-columns: 1fr; } }
</style>
</head>

<div class="container">
  <div class="header">

    </div>
  </div>
</div>

// Calculate MA10 for aluminum
function calcSMA(data, period) {
  const result = [];
  for (let i = 0; i < data.length; i++) {
    if (i < period - 1) { result.push(null); continue; }
    let sum = 0;
    for (let j = 0; j < period; j++) sum += data[i - j];
    result.push(sum / period);
  }
  return result;
}

(async function renderStocks() {

    if (!resp.ok) throw new Error('stocks.json not found');
    const data = await resp.json();

    container.innerHTML = '';
    let html = '';

        html += `<div class="stock-card"><span style="color:#5a7a8a">${s.name} ${s.error}</span></div>`;

      const isUp = s.change_pct >= 0;

      let sigClass = 'neutral';

})();
